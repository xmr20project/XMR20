[package]
name = "xmr20-unshielded-lab"
version = "0.0.0"
edition = "2021"
publish = false
description = "Roles binary (indexer, issuer, setup) for the XMR20 unshielded-by-default token format over an offline fakechain or stagenet daemon. UNREVIEWED research code."

[[bin]]
name = "xmr20-unshielded-lab"
path = "src/main.rs"

[dependencies]
xmr20-unshielded-core = {path = "../core"}
anyhow = "1"
ark-groth16 = {version = "=0.4.0", features = ["parallel"]}
ark-serialize = "=0.4.2"
decaf377 = {version = "=0.10.1", features = ["r1cs"]}
decaf377-rdsa = "=0.11.0"
penumbra-sdk-asset = {version = "=2.1.1", default-features = false}
penumbra-sdk-keys = {version = "=2.1.1", default-features = false}
penumbra-sdk-shielded-pool = {version = "=2.1.1", default-features = false}
rand_core = {version = "=0.6.4", features = ["getrandom"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rayon = "=1.12.0"
monero-wallet = "=0.2.0"
monero-clsag = "=0.1.0"
curve25519-dalek = "=4.1.3"
zeroize = "=1.8.2"
monero-simple-request-rpc = "=0.1.0"
chacha20poly1305 = "=0.9.1"
blake2b_simd = "=1.0.5"
tokio = {version = "1", features = ["rt", "macros"]}

[patch.crates-io]
monero-wallet = {path = "../../../proof-of-concepts/native-market-local/vendor/monero-wallet"}
penumbra-sdk-shielded-pool = {path = "../../privacy-single-tx-20261022/vendor/penumbra-sdk-shielded-pool"}

[workspace]
