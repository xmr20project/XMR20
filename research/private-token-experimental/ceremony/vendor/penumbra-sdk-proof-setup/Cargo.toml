[package]
name = "penumbra-sdk-proof-setup"
version = "2.1.1"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "VENDORED single-circuit subset of penumbra-sdk-proof-setup 2.1.1 (see src/lib.rs for the exact changes)"

[lib]
name = "penumbra_sdk_proof_setup"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
ark-ec = {version = "=0.4.2", default-features = false}
ark-ff = {version = "=0.4.2", default-features = false}
ark-groth16 = {version = "=0.4.0", default-features = false}
ark-poly = {version = "=0.4.2", default-features = false}
ark-relations = "=0.4.0"
ark-serialize = "=0.4.2"
blake2b_simd = "=1.0.5"
decaf377 = {version = "=0.10.1", default-features = false}
rand_core = {version = "=0.6.4", features = ["getrandom"]}
rayon = {version = "=1.12.0", optional = true}

[features]
default = ["parallel"]
parallel = ["dep:rayon", "ark-ec/parallel", "ark-ff/parallel", "ark-poly/parallel", "ark-groth16/parallel"]
