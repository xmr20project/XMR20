[package]
name = "xmr20-holder-wasm"
version = "0.0.0"
edition = "2021"
publish = false
description = "Holder-side private token engine: key derivation, local scanning, record building. Compiled to wasm32 for the extension worker. UNREVIEWED synthetic-test code."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
blake2b_simd = "=1.0.5"
decaf377-ka = "=2.1.1"
ark-ff = "=0.4.2"
ark-groth16 = "=0.4.0"
ark-relations = "=0.4.0"
ark-serialize = "=0.4.2"
ark-snark = "=0.4.0"
decaf377 = {version = "=0.10.1", features = ["r1cs"]}
decaf377-rdsa = "=0.11.0"
penumbra-sdk-asset = {version = "=2.1.1", default-features = false}
penumbra-sdk-keys = {version = "=2.1.1", default-features = false}
penumbra-sdk-shielded-pool = {version = "=2.1.1", default-features = false}
penumbra-sdk-proof-params = {version = "=2.1.1", default-features = false}
penumbra-sdk-tct = {version = "=2.1.1", default-features = false}
penumbra-sdk-sct = {version = "=2.1.1", default-features = false}
penumbra-sdk-proto = {version = "=2.1.1", default-features = false}
rand_core = {version = "=0.6.4", features = ["getrandom"]}
getrandom = {version = "=0.2.17", features = ["custom"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zeroize = "=1.8.2"
# Native carrier construction inside the holder (stage 2): the same monero-wallet (monero-oxide) build the lab roles use.
monero-wallet = {path = "vendor/monero-wallet", default-features = false, features = ["std", "compile-time-generators"]}
rand_chacha = "=0.3.1"
curve25519-dalek = "=4.1.3"


[patch.crates-io]
getrandom = {path = "vendor/getrandom-0.2.17"}
penumbra-sdk-shielded-pool = {path = "vendor/penumbra-sdk-shielded-pool"}

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[workspace]
