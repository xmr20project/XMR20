name: Read indexer checks
on:
  push:
    paths: ['indexer/**', '.github/workflows/indexer.yml']
  pull_request:
    paths: ['indexer/**', '.github/workflows/indexer.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test with network disabled
        run: sudo unshare --net -- env "PATH=$PATH" npm test
      - name: Check deterministic rebuild
        run: |
          cp build/hashes.json /tmp/xmr20-first-build-hashes.json
          npm run build
          cmp /tmp/xmr20-first-build-hashes.json build/hashes.json
